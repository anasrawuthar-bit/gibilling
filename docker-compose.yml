version: '3.8'

# ==============================================================================
# ZynBill / Corezyn Cloud Ecosystem - Self-Hosted Coolify Deployment
# Standard Single-Service Architecture using Node 22 Native SQLite (WAL Mode)
# ==============================================================================

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${PORT:-4000}:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:4000}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:4000,http://127.0.0.1:4000}
      - SUPER_ADMIN_NAME=${SUPER_ADMIN_NAME:-Corezyn}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:-admin@yourdomain.in}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD}
      - SMTP_HOST=${SMTP_HOST:-smtp.hostinger.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM:-Corezyn <noreplay@anasrawuthar.in>}
    volumes:
      # Persistent storage for SQLite master DB, tenant DBs, backups, and staging
      - server_data:/app/server/data
      # Persistent storage for published installer executables, manifests, and blockmaps
      - server_downloads:/app/server/public/downloads

volumes:
  server_data:
  server_downloads:
